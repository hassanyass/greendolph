name: Website checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [preview, production]
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_ENV: ${{ matrix.mode }}
      SITE_URL: ${{ matrix.mode == 'production' && 'https://example.com' || '' }}
      SITE_INDEXABLE: ${{ matrix.mode == 'production' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run verify:build
      - name: Upload review build
        if: matrix.mode == 'preview'
        uses: actions/upload-artifact@v7
        with:
          name: website-preview
          path: dist/
          retention-days: 7
