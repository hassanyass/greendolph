[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Keep branch and pull-request previews outside search results.
[context.deploy-preview.environment]
  SITE_ENV = "preview"
  SITE_INDEXABLE = "false"

[context.branch-deploy.environment]
  SITE_ENV = "preview"
  SITE_INDEXABLE = "false"
